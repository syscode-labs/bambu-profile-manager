services:
  bambupm:
    build: .
    image: bambupm:local
    ports:
      - "8080:8080"
    volumes:
      - bambupm-data:/data
      # Uncomment to give the CLI's future rebind/publish commands access to
      # your real Bambu Studio profile directory (design.md §5's
      # bind-mounted /bambu-user). Not required for `serve` (web UI) alone —
      # see README's "Known limitations" section before using this for
      # publish: the Studio-running safety check can't see host processes
      # from inside a container.
      # - ~/Library/Application Support/BambuStudio/user/<your-account-id>:/bambu-user

volumes:
  bambupm-data:
