name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # GitHub-hosted runners have a single, consistent Go toolchain —
          # the local-machine GOROOT/mise version mismatch noted in
          # openspec/changes/init-profile-manager (rate-queue notes) doesn't
          # apply here.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
      - name: Fuzz smoke test
        run: |
          go test ./internal/resolver/ -run=NONE -fuzz=FuzzParse -fuzztime=10s
          go test ./internal/resolver/ -run=NONE -fuzz=FuzzResolveNoPanic -fuzztime=10s

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64 + arm64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
