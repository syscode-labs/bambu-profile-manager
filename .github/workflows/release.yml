name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # bpm-tray (macOS menu bar app) needs Cocoa via cgo, so it can't cross-
  # compile from the ubuntu runner above like bpm's CGO_ENABLED=0 build
  # does — built separately on a real macOS runner and appended to the
  # release goreleaser already created.
  tray:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build bpm-tray for both Apple Silicon and Intel
        run: |
          # Binary inside the archive stays plain "bpm-tray" (only the
          # .tar.gz filename is versioned) so the Homebrew formula's
          # `bin.install "bpm-tray"` finds it - matches how goreleaser's own
          # archives contain a plain "bpm", not "bpm_vX_os_arch".
          for arch in arm64 amd64; do
            dir="dist-tray/darwin_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=1 GOARCH=$arch go build -o "$dir/bpm-tray" ./cmd/bpm-tray
            tar -C "$dir" -czf "dist-tray/bpm-tray_${{ github.ref_name }}_darwin_${arch}.tar.gz" bpm-tray
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist-tray/*.tar.gz --clobber
