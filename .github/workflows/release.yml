name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # bpm-tray (macOS menu bar app) needs Cocoa via cgo, so it can't cross-
  # compile from the ubuntu runner above like bpm's CGO_ENABLED=0 build
  # does — built separately on a real macOS runner and appended to the
  # release goreleaser already created.
  tray:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build bpm and bpm-tray for both Apple Silicon and Intel
        run: |
          # Both binaries go inside the same .app bundle below, so one
          # `brew install --cask` gives you the CLI (on PATH via the cask's
          # `binary` stanza) and the menu bar app together - a plain
          # Homebrew Formula can't do this itself (see the cask's own
          # comment on why).
          #
          # MACOSX_DEPLOYMENT_TARGET matters for bpm-tray specifically: real
          # bug found live - left unset, the macos-latest runner's cgo
          # linker embeds whatever its own SDK defaults to (observed: minos
          # 26.0) into the binary's LC_BUILD_VERSION load command. `open`/
          # LaunchServices enforces that against the *running* OS - unlike a
          # direct exec, which ignores it - so the resulting .app failed to
          # launch via Finder/Spotlight on any real Mac not yet running that
          # OS version, while still running fine from a terminal. Pinned to
          # 11.0 to match Info.plist.template's LSMinimumSystemVersion. bpm
          # itself has no cgo/Cocoa dependency, so it doesn't need the pin,
          # but setting it for both is simpler and harmless.
          for arch in arm64 amd64; do
            dir="dist-tray/darwin_${arch}"
            mkdir -p "$dir"
            MACOSX_DEPLOYMENT_TARGET=11.0 CGO_ENABLED=1 GOARCH=$arch go build -o "$dir/bpm-tray" ./cmd/bpm-tray
            MACOSX_DEPLOYMENT_TARGET=11.0 CGO_ENABLED=0 GOARCH=$arch go build -o "$dir/bpm" ./cmd/bpm
          done
      - name: Build AppIcon.icns from the embedded logo
        run: |
          mkdir -p /tmp/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size internal/webui/assets/logo.png --out /tmp/icon.iconset/icon_${size}x${size}.png >/dev/null
            double=$((size*2))
            sips -z $double $double internal/webui/assets/logo.png --out /tmp/icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns /tmp/icon.iconset -o /tmp/AppIcon.icns
      - name: Assemble Bambu Profile Manager (bpm).app for both architectures
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          for arch in arm64 amd64; do
            # The .app folder name is what Spotlight/Launchpad actually
            # match against - real bug found live: CFBundleName/
            # CFBundleDisplayName in Info.plist do NOT affect Spotlight
            # search at all (confirmed: mdfind found nothing for "bpm" with
            # only the plist fields set, until "(bpm)" was added to the
            # folder name itself). Without this, searching "bpm" - the
            # product's own short name - found no match and macOS offered
            # its Stocks-ticker-lookup suggestion instead, which looks like
            # a real result until you click it.
            #
            # The release asset's own filename stays the technical
            # "BpmTray_..." for a stable download URL across renames.
            app="dist-tray/darwin_${arch}/Bambu Profile Manager (bpm).app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            sed "s/VERSION_PLACEHOLDER/${version}/" packaging/macos/Info.plist.template > "$app/Contents/Info.plist"
            cp "dist-tray/darwin_${arch}/bpm-tray" "$app/Contents/MacOS/bpm-tray"
            cp "dist-tray/darwin_${arch}/bpm" "$app/Contents/MacOS/bpm"
            cp /tmp/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
            plutil -lint "$app/Contents/Info.plist"
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist-tray/BpmTray_${{ github.ref_name }}_darwin_${arch}.zip"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} dist-tray/*.zip --clobber
